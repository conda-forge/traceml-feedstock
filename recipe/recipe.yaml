schema_version: 1

context:
  name: traceml
  version: "1.2.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/traceml-${{ version }}.tar.gz
    sha256: 2e616b149ff4c15a6c3e06a473d4a68c4e2f2ea8d1f74be65b758a0ac95418a8
  - url: https://raw.githubusercontent.com/polyaxon/traceml/7e13f469a08aee289c0d63e5b208b4cc3eb2781c/traceml/requirements/dev.txt
    sha256: aa7d382fdfa94b732a3b3447460c0130962d0e89ac76dfb4a0062f2fbc04e812
    file_name: requirements_dev.txt

build:
  number: 0
  noarch: python
  script:
    - mkdir requirements
    - mv requirements_dev.txt requirements/dev.txt
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - traceml
      pip_check: true
      python_version: 
       - ${{ python_min }}.*
       - '*'

about:
  summary: Engine for ML/Data tracking, visualization, dashboards, and model UI for Polyaxon.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/polyaxon/traceml

extra:
  recipe-maintainers:
    - xhochy
